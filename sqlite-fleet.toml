[project]
name = "sqlite-fleet-project"

[databases]
discovery = "glob"
path_glob = "./data/**/*.db"

[migrations]
dir = "./migrations"
table = "_sqlite_fleet_migrations"

[migration_groups]
main = [
    "001_create_customers.sql",
    "002_create_orders.sql",
    "003_add_customer_status.sql",
    "004_create_order_index.sql",
]

[execution]
parallel = 4
lock_timeout_ms = 5000
continue_on_error = false

[report]
format = "json"
path = "./sqlite-fleet-report.json"

[backup]
dir = "./backups"
before_migrate = false
keep_last = 10

[audit]

[gui]
allow_check = true
allow_migrate = false
allow_backup = false
allow_restore = false
allow_sql_apply = false
allow_migration_edit = false

[groups]

[db_groups]
demo = [
    "tenant_all",
    "tenant_partial",
    "tenant_empty",
]
canary = ["tenant_partial"]
